<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COACH BOARD — Rotaciones de voleibol</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>COACH BOARD</h1>

        <h2>Plantilla</h2>
        <textarea
          id="roster-input"
          rows="9"
          spellcheck="false"
          placeholder="Pega o escribe la lista, un nombre por linea:&#10;&#10;1. Ramiro&#10;2. Tobi&#10;&#10;Ninas&#10;1. Irma&#10;2. Pili"
        ></textarea>
        <button id="btn-players" type="button">Generar jugadores</button>

        <div class="saved">
          <h3 class="saved__title">Guardadas</h3>
          <div class="saved__form">
            <input
              id="tpl-name"
              class="saved__input"
              type="text"
              placeholder="Nombre del equipo"
            />
            <button id="btn-save-template" type="button" disabled>
              Guardar plantilla
            </button>
          </div>
          <div id="saved-list" class="saved__list"></div>
        </div>

        <div id="roster-list" class="roster"></div>
      </aside>

      <main class="main">
        <h2>Posicion inicial</h2>
        <div id="court-host"></div>

        <div class="controls">
          <button id="btn-rotations" type="button" disabled>
            Generar rotaciones
          </button>
          <button id="btn-clear" type="button" disabled>Vaciar cancha</button>
          <input
            id="lineup-name"
            class="controls__input"
            type="text"
            placeholder="Nombre posicion"
          />
          <button id="btn-save-lineup" type="button" disabled>
            Guardar posicion
          </button>
          <span id="counter" class="counter">0/6 en cancha</span>
        </div>

        <div id="cards" class="cards"></div>
      </main>
    </div>

    <!-- Scripts clasicos y en este orden: con type="module" la pagina no
         funcionaria abriendola con doble clic (file:// bloquea los modulos). -->
    <script src="js/rotations.js"></script>
    <script src="js/roster.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/court.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
